let fbAuth = null;
let fbDb = null;
let currentUser = null;

function isFirebaseConfigured() {
  return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";
}
function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[src="${src}"]`);
    if (existing) { resolve(); return; }
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("נכשלה טעינת " + src));
    document.head.appendChild(s);
  });
}
async function tryInitFirebase() {
  if (!isFirebaseConfigured()) return false;
  try {
    await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.min.js");
    await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-auth-compat.min.js");
    await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-firestore-compat.min.js");
    if (typeof firebase === "undefined") return false;
    firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    return true;
  } catch (e) {
    console.error("firebase load/init failed", e);
    return false;
  }
}
function translateAuthError(code) {

<script>
/* ---------------- storage helpers ---------------- */
const uid = () => Math.random().toString(36).slice(2, 9);

const STORAGE_PREFIX = "echk:";

function storeGet(key, fallback) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    if (raw === null || raw === undefined) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    console.error("storage get failed", key, e);
    return fallback;
  }
}
function storeSet(key, val) {
  try {
    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(val));
    return true;
  } catch (e) {
    console.error("storage set failed", key, e);
    return false;
  }
}

function storageSelfTest() {
  try {
    const testKey = STORAGE_PREFIX + "__test__";
    localStorage.setItem(testKey, "1");
    const ok = localStorage.getItem(testKey) === "1";
    localStorage.removeItem(testKey);
    return ok;
  } catch (e) {
    console.error("storage self-test failed", e);
    return false;
  }
}

async function loadIndex() {
  return storeGet("sites-index", []);
}
async function saveIndexStorage(list) {
  const ok = storeSet("sites-index", list);
  return ok ? { ok: true } : { ok: false, error: "האחסון בדפדפן חסום או מלא." };
}
async function loadSiteStorage(id) {
  const data = storeGet(`site:${id}`, null);
  if (!data) return { data: null, error: "לא נמצאו נתונים שמורים עבור האתר הזה." };
  return { data, error: null };
}
async function saveSiteStorage(site) {
  const ok = storeSet(`site:${site.id}`, site);
  return ok ? { ok: true } : { ok: false, error: "האחסון בדפדפן חסום או מלא." };
}
async function deleteSiteStorage(id) {
  try { localStorage.removeItem(STORAGE_PREFIX + `site:${id}`); } catch (e) { console.error(e); }
}

/* ---------------- cloud sync (Firebase) ---------------- */
async function syncSiteToCloud(site) {
  if (!state.cloudMode || !currentUser) return;
  try {
    await fbDb.collection("users").doc(currentUser.uid).collection("sites").doc(site.id).set(site);
  } catch (e) {
    console.error("cloud sync failed", e);
    state.errorMsg = "השינוי נשמר במכשיר, אבל הסנכרון לחשבון נכשל (" + ((e && e.message) || e) + ").";
  }
}
async function deleteSiteFromCloud(id) {
  if (!state.cloudMode || !currentUser) return;
  try {
    await fbDb.collection("users").doc(currentUser.uid).collection("sites").doc(id).delete();
  } catch (e) { console.error("cloud delete failed", e); }
}

async function onLogin(user) {
  state.loading = true;
  render();
  try {
    const snapshot = await fbDb.collection("users").doc(user.uid).collection("sites").get();
    const cloudSites = {};
    snapshot.forEach((doc) => { cloudSites[doc.id] = doc.data(); });

    // Any sites that exist only locally (created before logging in, or on another
    // offline session) get uploaded so nothing is lost.
    let uploadedCount = 0;
    for (const localSite of state.sites) {
      if (!cloudSites[localSite.id]) {
        const full = state.siteCache[localSite.id] || localSite;
        await fbDb.collection("users").doc(user.uid).collection("sites").doc(localSite.id).set(full);
        cloudSites[localSite.id] = full;
        uploadedCount++;
      }
    }

    state.siteCache = cloudSites;
    state.sites = Object.values(cloudSites);
    state.cloudMode = true;
    await saveIndexStorage(state.sites);
    Object.values(cloudSites).forEach((s) => saveSiteStorage(s));

    if (uploadedCount > 0) {
      state.errorMsg = `${uploadedCount} אתרים שהיו על המכשיר הזה הועלו לחשבון שלך.`;
    }
  } catch (e) {
    state.errorMsg = "ההתחברות הצליחה אבל סנכרון הנתונים נכשל (" + ((e && e.message) || e) + ").";
  }
  state.loading = false;
  state.view = "home";
  render();
}

/* ---------------- dom helper ---------------- */
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  attrs = attrs || {};
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(c) : c);
  }
  return el;
}

/* ---------------- icons ---------------- */
const ICON_PATHS = {

function textInput(opts) {

function numberedTextarea(opts) {
  opts = opts || {};
  const ta = document.createElement("textarea");
  ta.className = "input textarea";
  ta.rows = opts.rows || 6;
  ta.placeholder = opts.placeholder || "";
  ta.setAttribute("dir", "auto");
  ta.value = opts.value || "";

  ta.addEventListener("input", (e) => { if (opts.onChange) opts.onChange(e.target.value); });

  ta.addEventListener("focus", () => {
    if (!ta.value) {
      ta.value = "1. ";
      if (opts.onChange) opts.onChange(ta.value);
      ta.selectionStart = ta.selectionEnd = 3;
    }
  });

  ta.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const cursorPos = ta.selectionStart;
    const current = ta.value;
    const before = current.slice(0, cursorPos);
    const after = current.slice(cursorPos);
    const lines = before.split("\n");
    const currentLine = lines[lines.length - 1];
    const match = currentLine.match(/^(\d+)\.\s?/);
    let newValue, newPos;
    if (match && currentLine.trim() === match[0].trim()) {
      const newBefore = before.slice(0, before.length - currentLine.length);
      newValue = newBefore + "\n" + after;
      newPos = newBefore.length + 1;
    } else {
      let nextNum = 1;
      if (match) nextNum = parseInt(match[1], 10) + 1;
      else {
        for (let i = lines.length - 1; i >= 0; i--) {
          const m = lines[i].match(/^(\d+)\.\s?/);
          if (m) { nextNum = parseInt(m[1], 10) + 1; break; }
        }
      }
      const insertion = `\n${nextNum}. `;
      newValue = before + insertion + after;
      newPos = before.length + insertion.length;
    }
    ta.value = newValue;
    if (opts.onChange) opts.onChange(newValue);
    ta.selectionStart = ta.selectionEnd = newPos;
  });

  ta.insertTemplate = (label) => {
    const current = ta.value || "";
    const lines = current.split("\n");
    let lastNum = 0;
    for (let i = lines.length - 1; i >= 0; i--) {
      const m = lines[i].match(/^(\d+)\.\s?/);
      if (m) { lastNum = parseInt(m[1], 10); break; }
    }
    const lastLine = lines[lines.length - 1];
    const lastLineMatch = lastLine.match(/^(\d+)\.\s?(.*)$/);
    let newValue;
    if (current.trim() === "") newValue = `1. ${label}: `;
    else if (lastLineMatch && lastLineMatch[2].trim() === "") newValue = current.slice(0, current.length - lastLine.length) + `${lastLineMatch[1]}. ${label}: `;
    else newValue = current + (current.endsWith("\n") ? "" : "\n") + `${lastNum + 1}. ${label}: `;
    ta.value = newValue;
    if (opts.onChange) opts.onChange(newValue);
    ta.focus();
    ta.selectionStart = ta.selectionEnd = newValue.length;
  };

  return ta;
}

  filtered.forEach((s) => listWrap.appendChild(siteCard(s)));
}

function siteCard(s) {
  const pct = progressOf(s);
  const info = h("div", { style: "min-width:0;flex:1;" }, h("h2", { class: "site-name" }, s.name || "אתר ללא שם"));
  if (s.customer) info.appendChild(h("p", { class: "site-meta" }, icon("user", { size: 12 }), h("span", {}, s.customer)));
  if (s.address) info.appendChild(h("p", { class: "site-meta" }, icon("mapPin", { size: 12 }), h("span", {}, s.address)));
  const top = h("div", { class: "site-card-top" }, info, icon("chevronRight", { size: 18, class: "chev flip" }));
  const bottom = h("div", { class: "site-card-bottom" }, breakerStrip(s), h("span", { class: "pct" }, pct + "%"));
  return h("button", { class: "site-card", onclick: () => openSite(s.id) }, top, bottom);
}

async function openSite(id) {
  state.errorMsg = "";

  // Prefer the in-memory copy from this session — it's always accurate and
  // doesn't depend on the storage backend, which can intermittently fail.
  if (state.siteCache[id]) {
    state.activeSite = state.siteCache[id];
    state.view = "detail";
    state.detail = { tab: "overview", editing: false, editForm: null, confirmDelete: false, suggestions: freshSuggestions(), addingEquipmentFor: null };
    render();
    return;
  }

  state.loading = true; render();
  const { data, error } = await loadSiteStorage(id);
  state.loading = false;
  if (!data) {
    state.errorMsg = (error || "לא הצלחתי לטעון את כרטיס האתר.") + " (זה נראה כמו תקלה זמנית באחסון של Claude, לא בעיה באפליקציה עצמה.)";
    render();
    return;
  }
  state.siteCache[id] = data;
  state.activeSite = data;
  state.view = "detail";
  state.detail = { tab: "overview", editing: false, editForm: null, confirmDelete: false, suggestions: freshSuggestions(), addingEquipmentFor: null };
  render();
}

/* ---------------- wizard (new site) ---------------- */
function stepDotsEl(count, current) {
  const wrap = h("div", { class: "step-dots" });
  for (let i = 0; i < count; i++) wrap.appendChild(breaker(i <= current));
  return wrap;
}

function renderWizard() {
  const st = state.wizard;
  const form = st.form;
  const cfg = WIZARD_STEPS[st.step];
  const isFirst = st.step === 0;

  const screen = h("div", { class: "screen", style: "padding-bottom:0;" });

  const header = h("div", { class: "header" });

  }, isFirst ? icon("x", { size: 22 }) : icon("chevronRight", { size: 22, class: "flip" }));
  header.appendChild(h("div", { class: "wizard-head-row" }, backBtn,
    h("div", { style: "min-width:0;" },

  const body = h("div", { class: "wizard-body" });
  body.appendChild(h("p", { class: "muted step-subtitle" }, cfg.subtitle));

  let nextBtn, nextLabelSpan;

  if (st.step === 0) {
    const nameInput = textInput({ value: form.name, placeholder: "לדוגמה: וילה פרטית — רחוב האלון 12" });
    nameInput.addEventListener("input", (e) => {
      form.name = e.target.value;
      if (nextBtn) nextBtn.disabled = form.name.trim().length === 0;
    });
    body.appendChild(fieldWrap("שם האתר / הפרויקט", nameInput));
    const addressInput = textInput({ value: form.address, placeholder: "עיר, רחוב ומספר" });
    addressInput.addEventListener("input", (e) => { form.address = e.target.value; });
    body.appendChild(fieldWrap("כתובת האתר", addressInput));
    const dateInput = h("input", { type: "date", class: "input", value: form.visitDate });
    dateInput.addEventListener("input", (e) => { form.visitDate = e.target.value; });

    setTimeout(() => nameInput.focus(), 30);
  }

  if (st.step === 1) {
    const customerInput = textInput({ value: form.customer, placeholder: "שם הלקוח" });
    const phoneInput = textInput({ value: form.phone, placeholder: "050-0000000", dir: "ltr", class: "" });
    phoneInput.style.textAlign = "left";
    const syncLabel = () => { if (nextLabelSpan) nextLabelSpan.textContent = (!form.customer.trim() && !form.phone.trim()) ? "דלג" : "המשך"; };
    customerInput.addEventListener("input", (e) => { form.customer = e.target.value; syncLabel(); });
    phoneInput.addEventListener("input", (e) => { form.phone = e.target.value; syncLabel(); });
    body.appendChild(fieldWrap("לקוח", customerInput));
    body.appendChild(fieldWrap("טלפון", phoneInput));
    setTimeout(() => customerInput.focus(), 30);
  }

  if (st.step === 2) {
    const ta = numberedTextarea({ value: form.requirements, rows: 8, placeholder: "הקישו Enter אחרי כל דרישה — היא תתמספר אוטומטית...", onChange: (v) => { form.requirements = v; } });
    body.appendChild(fieldWrap("דרישות הלקוח", ta));
  }

  if (st.step === 3) {
    const ta = numberedTextarea({ value: form.firstImpressions, rows: 8, placeholder: "הקישו על תגית למעלה, או כתבו חופשי — כל שורה תתמספר...", onChange: (v) => { form.firstImpressions = v; } });
    const wrapField = h("label", { class: "field" }, h("span", { class: "field-label" }, "רשמים ראשוניים מהאתר"), quickTags(IMPRESSION_TAGS, (label) => ta.insertTemplate(label)), ta);
    body.appendChild(wrapField);
  }

  if (st.step === 4) {
    const basicsCard = h("div", { class: "review-card" });
    basicsCard.appendChild(h("div", { class: "review-card-head" }, h("h3", {}, "פרטי האתר"), h("button", { class: "link-btn", onclick: () => { st.step = 0; render(); } }, "ערוך")));
    const nameR = textInput({ value: form.name, placeholder: "שם האתר" });
    nameR.addEventListener("input", (e) => { form.name = e.target.value; });
    basicsCard.appendChild(fieldWrap("שם האתר", nameR));
    const addrR = textInput({ value: form.address });
    addrR.addEventListener("input", (e) => { form.address = e.target.value; });
    basicsCard.appendChild(fieldWrap("כתובת", addrR));
    body.appendChild(basicsCard);

    const custCard = h("div", { class: "review-card" });
    custCard.appendChild(h("div", { class: "review-card-head" }, h("h3", {}, "פרטי לקוח"), h("button", { class: "link-btn", onclick: () => { st.step = 1; render(); } }, "ערוך")));
    const row = h("div", { class: "row2" });
    const custR = textInput({ value: form.customer });
    custR.addEventListener("input", (e) => { form.customer = e.target.value; });
    const phoneR = textInput({ value: form.phone, dir: "ltr" });
    phoneR.style.textAlign = "left";
    phoneR.addEventListener("input", (e) => { form.phone = e.target.value; });
    row.appendChild(fieldWrap("לקוח", custR));
    row.appendChild(fieldWrap("טלפון", phoneR));
    custCard.appendChild(row);
    body.appendChild(custCard);

    const reqTa = numberedTextarea({ value: form.requirements, rows: 6, placeholder: "אין דרישות רשומות — אפשר להוסיף כאן.", onChange: (v) => { form.requirements = v; } });
    body.appendChild(fieldWrap("דרישות הלקוח", reqTa));

    const impTa = numberedTextarea({ value: form.firstImpressions, rows: 6, placeholder: "אין רשמים רשומים — אפשר להוסיף כאן.", onChange: (v) => { form.firstImpressions = v; } });

  const footer = h("div", { class: "footer-nav" });

    if (isLast) { createSiteFromWizard(form); return; }

    st.step += 1;
    render();
  });
  footer.appendChild(nextBtn);
  screen.appendChild(footer);

  return screen;
}

async function createSiteFromWizard(form) {
  state.errorMsg = "";
  state.saving = true;
  render();

  const site = blankSite(form);
  const res = await saveSiteStorage(site);
  const indexEntry = { id: site.id, name: site.name, customer: site.customer, address: site.address, createdAt: site.createdAt, tasks: [], equipment: [], stages: [] };
  const newIndex = [indexEntry, ...state.sites];
  const idxRes = await saveIndexStorage(newIndex);

  state.sites = newIndex;
  state.siteCache[site.id] = site;
  state.activeSite = site;
  state.view = "detail";
  state.detail = { tab: "overview", editing: false, editForm: null, confirmDelete: false, suggestions: freshSuggestions(), addingEquipmentFor: null };
  state.saving = false;

  if (!res.ok || !idxRes.ok) {
    const detail = !res.ok ? res.error : idxRes.error;
    state.errorMsg = `הכרטיס פתוח ונשמר זמנית בזיכרון (תוכל להמשיך לעבוד בו כרגיל), אבל השמירה הקבועה נכשלה (${detail}) — זו כנראה תקלה זמנית בשירות האחסון. אם תסגור את הצ'אט או תרענן, המידע יימחק — מומלץ להעתיק את הרשמים שלך למקום אחר בינתיים.`;
  }
  await syncSiteToCloud(site);
  render();
}

/* ---------------- site detail ---------------- */
async function persistUpdatedSite(updated) {
  state.activeSite = updated;
  state.siteCache[updated.id] = updated;
  const res = await saveSiteStorage(updated);
  if (!res.ok) state.errorMsg = `שינוי זה נשמר בזיכרון להמשך העבודה, אבל השמירה הקבועה נכשלה (${res.error}) — כנראה תקלה זמנית באחסון.`;
  const newIndex = state.sites.map((s) => s.id === updated.id
    ? { ...s, name: updated.name, customer: updated.customer, address: updated.address, tasks: updated.tasks, equipment: updated.equipment, stages: updated.stages }
    : s);
  state.sites = newIndex;
  await saveIndexStorage(newIndex);
  await syncSiteToCloud(updated);
  render();
}

function checklistSection(cfg) {
  const { title, iconName, items, key, withQty, reorderable, withEquipmentLink, equipmentMode, autoStatusFn, withStageLink, onAfterToggle, onAfterDelete } = cfg;
  const wrap = h("div", {});
  const done = equipmentMode ? items.filter(isEquipmentReady).length : items.filter((i) => i.done).length;
  wrap.appendChild(h("div", { class: "section-title", style: "justify-content:space-between;" },
    h("div", { style: "display:flex;align-items:center;gap:8px;" }, icon(iconName, { size: 16 }), h("h3", {}, title)),
    h("span", { class: "count-badge" }, `${done}/${items.length}`)));

  const list = h("div", {});
  if (items.length === 0) list.appendChild(h("p", { class: "empty-hint" }, "עדיין לא נוספו פריטים."));
  if (reorderable && items.length > 1) list.appendChild(h("p", { class: "empty-hint", style: "padding:0 0 6px;" }, "אפשר לגרור פריטים (בעזרת הידית) כדי לשנות את הסדר."));

  items.forEach((item) => {
    const itemWrap = h("div", { class: "checklist-item", "data-id": item.id });
    const row = h("div", { class: "checklist-row", style: "margin-bottom:0;" });

    if (reorderable) {
      const handle = h("div", { class: "drag-handle" }, icon("grip", { size: 16 }));
      handle.addEventListener("pointerdown", (e) => startDrag(e, handle, itemWrap, list, key));
      row.appendChild(handle);
    }

    const auto = autoStatusFn ? autoStatusFn(item) : null;

    if (equipmentMode) {
      row.appendChild(equipmentStatusPill(item));
    } else if (auto) {
      row.appendChild(breaker(auto.allDone));
    } else {
      const toggleBtn = h("button", { class: "icon-btn", style: "padding:0;", onclick: () => {
        item.done = !item.done;
        if (onAfterToggle) onAfterToggle(item);
        persistUpdatedSite(state.activeSite);
      } }, breaker(item.done));
      row.appendChild(toggleBtn);
    }

    const links = item.requiredEquipment || [];
    const allEquipReady = links.length > 0 && links.every((l) => {
      const eq = state.activeSite.equipment.find((e) => e.id === l.id);
      return eq && isEquipmentReady(eq);
    });

    const textCol = h("div", { style: "flex:1;min-width:0;" });
    const textLine = h("p", { class: "checklist-text" + (!equipmentMode && (auto ? auto.allDone : item.done) ? " done" : "") });
    if (links.length > 0 && !allEquipReady) {
      const warnIcon = icon("alertTriangle", { size: 12 });
      warnIcon.style.color = "var(--red-soft)";
      warnIcon.style.marginLeft = "5px";
      warnIcon.style.verticalAlign = "-2px";
      textLine.appendChild(warnIcon);
    }
    textLine.appendChild(document.createTextNode(item.text));
    textCol.appendChild(textLine);
    if (item.qty) textCol.appendChild(h("p", { class: "checklist-qty" }, "כמות: " + item.qty));
    if (auto) textCol.appendChild(h("p", { class: "checklist-qty" }, `${auto.doneCount}/${auto.total} משימות הושלמו`));

    if (withStageLink) {
      const stageRow = h("div", { style: "margin-top:6px;display:flex;align-items:center;gap:6px;" });
      stageRow.appendChild(h("span", { class: "muted", style: "font-size:11px;flex-shrink:0;" }, "שלב:"));
      const select = document.createElement("select");
      select.className = "input";
      select.style.cssText = "font-size:12px;padding:5px 8px;width:auto;flex:1;";
      const noneOpt = document.createElement("option");
      noneOpt.value = "";
      noneOpt.textContent = "ללא שיוך";
      select.appendChild(noneOpt);
      (state.activeSite.stages || []).forEach((s) => {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.text;
        if (item.stageId === s.id) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener("change", () => {
        const oldStageId = item.stageId;
        item.stageId = select.value || null;
        syncStageFromTasks(state.activeSite, oldStageId);
        syncStageFromTasks(state.activeSite, item.stageId);
        persistUpdatedSite(state.activeSite);
      });
      stageRow.appendChild(select);
      textCol.appendChild(stageRow);
    }

    row.appendChild(textCol);

    row.appendChild(h("button", { class: "del-btn", onclick: () => {
      state.activeSite[key] = state.activeSite[key].filter((i) => i.id !== item.id);
      if (onAfterDelete) onAfterDelete(item);
      persistUpdatedSite(state.activeSite);
    } }, icon("trash", { size: 15 })));

    itemWrap.appendChild(row);
    if (withEquipmentLink) itemWrap.appendChild(equipmentSubRow(item));
    list.appendChild(itemWrap);
  });
  wrap.appendChild(list);

  const addRow = h("div", { class: "add-row" });
  const textField = textInput({ placeholder: "הוסף פריט..." });
  addRow.appendChild(textField);
  let qtyField = null;
  if (withQty) { qtyField = textInput({ placeholder: "כמות", class: "qty-input" }); addRow.appendChild(qtyField); }
  const doAdd = () => {
    const text = textField.value.trim();
    if (!text) return;
    const newItem = { id: uid(), text, done: false };
    if (withQty && qtyField.value.trim()) newItem.qty = qtyField.value.trim();
    if (withEquipmentLink) newItem.requiredEquipment = [];
    if (withStageLink) newItem.stageId = null;
    if (equipmentMode) newItem.status = "missing";
    state.activeSite[key] = [...state.activeSite[key], newItem];
    persistUpdatedSite(state.activeSite);
  };
  textField.addEventListener("keydown", (e) => { if (e.key === "Enter") doAdd(); });
  addRow.appendChild(h("button", { class: "add-btn", onclick: doAdd }, icon("plus", { size: 18 })));
  wrap.appendChild(addRow);

  return wrap;
}

function equipmentStatusPill(eq) {
  const status = equipmentStatusOf(eq);
  const meta = EQUIPMENT_STATUS_META[status];
  return h("button", {
    style: `padding:5px 10px; border-radius:999px; font-size:11px; font-weight:700; border:1px solid ${meta.border}; background:${meta.bg}; color:${meta.color}; flex-shrink:0; cursor:pointer;`,
    onclick: () => {
      eq.status = nextEquipmentStatus(status);
      eq.done = eq.status !== "missing";
      persistUpdatedSite(state.activeSite);
    }
  }, meta.label);
}

/* ---------------- equipment requirement linking (tasks/stages <-> equipment) ---------------- */
function linkEquipmentRequirement(item, name, qty) {
  const site = state.activeSite;
  name = name.trim();
  if (!name) return;
  let eq = site.equipment.find((e) => e.text.trim().toLowerCase() === name.toLowerCase());
  if (!eq) {
    eq = { id: uid(), text: name, done: false, status: "missing" };
    if (qty) eq.qty = qty;
    site.equipment = [...site.equipment, eq];
  } else if (qty && !eq.qty) {
    eq.qty = qty;
  }
  item.requiredEquipment = item.requiredEquipment || [];
  if (!item.requiredEquipment.some((r) => r.id === eq.id)) {
    item.requiredEquipment = [...item.requiredEquipment, { id: eq.id, name: eq.text }];
  }
}

function equipmentChip(item, link) {
  const site = state.activeSite;
  const eq = site.equipment.find((e) => e.id === link.id);
  const status = !eq ? "missing_link" : (isEquipmentReady(eq) ? "ready" : "pending");
  const label = eq ? eq.text : (link.name + " (הוסר מהציוד)");
  const styleByStatus = {
    ready: "background:rgba(61,220,132,.12); border-color:rgba(61,220,132,.4); color:var(--green);",
    pending: "background:rgba(245,165,36,.1); border-color:rgba(245,165,36,.35); color:var(--amber);",
    missing_link: "background:rgba(239,68,68,.1); border-color:rgba(239,68,68,.4); color:var(--red-soft);",
  };
  const iconByStatus = { ready: "checkSquare", pending: "package", missing_link: "alertTriangle" };

  const chip = h("span", { style: `display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 5px 3px 8px;border-radius:999px;border:1px solid;${styleByStatus[status]}` });
  chip.appendChild(icon(iconByStatus[status], { size: 11 }));
  chip.appendChild(h("span", {}, label));
  chip.appendChild(h("button", {

function startDrag(e, handleEl, rowEl, listEl, key) {
  e.preventDefault();
  rowEl.classList.add("dragging-row");

  const onMove = (ev) => {
    ev.preventDefault();
    const y = ev.clientY;
    const siblings = Array.from(listEl.children).filter((el) => el !== rowEl && el.classList.contains("checklist-item"));
    let placed = false;
    for (const sib of siblings) {
      const r = sib.getBoundingClientRect();
      const mid = r.top + r.height / 2;
      if (y < mid) {
        listEl.insertBefore(rowEl, sib);
        placed = true;
        break;
      }
    }
    if (!placed) listEl.appendChild(rowEl);
  };

  const onUp = () => {
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    rowEl.classList.remove("dragging-row");

    const finalIds = Array.from(listEl.children)
      .filter((el) => el.classList.contains("checklist-item"))
      .map((el) => el.dataset.id);
    const arr = state.activeSite[key];
    const byId = {};
    arr.forEach((it) => { byId[it.id] = it; });
    state.activeSite[key] = finalIds.map((id) => byId[id]).filter(Boolean);
    persistUpdatedSite(state.activeSite);
  };

  document.addEventListener("pointermove", onMove, { passive: false });
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
}

function stagesTab(site) {
  const wrap = h("div", {});

      persistUpdatedSite(state.activeSite);

  }
  wrap.appendChild(checklistSection({
    title: "שלבי עבודה", iconName: "list", items: site.stages, key: "stages",
    reorderable: true, withEquipmentLink: true,
    autoStatusFn: (stage) => {
      const linked = (state.activeSite.tasks || []).filter((t) => t.stageId === stage.id);
      if (linked.length === 0) return null;
      return { doneCount: linked.filter((t) => t.done).length, total: linked.length, allDone: linked.every((t) => t.done) };
    },
    onAfterDelete: (stage) => {
      state.activeSite.tasks = (state.activeSite.tasks || []).map((t) => (t.stageId === stage.id ? { ...t, stageId: null } : t));
    },
  }));
  return wrap;
}

/* ---------------- smart suggestions (local, offline analysis) ---------------- */
async function runAnalysis(site) {
  const sug = state.detail.suggestions;
  sug.loading = true;
  render();

  const result = localHeuristicSuggestions(site);
  sug.stages = result.stages;
  sug.tasks = result.tasks;
  sug.stagesChecked = new Set(result.stages.map((_, i) => i));
  sug.tasksChecked = new Set(result.tasks.map((_, i) => i));
  sug.loading = false;
  render();
}

function applySuggestions() {
  const sug = state.detail.suggestions;
  const site = state.activeSite;
  const newStages = sug.stages.filter((_, i) => sug.stagesChecked.has(i)).map((t) => ({ id: uid(), text: t, done: false }));
  const newTasks = sug.tasks.filter((_, i) => sug.tasksChecked.has(i)).map((t) => ({ id: uid(), text: t, done: false }));
  if (newStages.length) site.stages = [...site.stages, ...newStages];
  if (newTasks.length) site.tasks = [...site.tasks, ...newTasks];
  sug.stages = sug.stages.filter((_, i) => !sug.stagesChecked.has(i));
  sug.tasks = sug.tasks.filter((_, i) => !sug.tasksChecked.has(i));
  sug.stagesChecked = new Set();
  sug.tasksChecked = new Set();
  persistUpdatedSite(site);
}

function suggestionRow(text, checkedSet, idx) {
  const row = h("div", { class: "checklist-row" });
  row.appendChild(h("button", {
    class: "icon-btn", style: "padding:0;", onclick: () => {
      if (checkedSet.has(idx)) checkedSet.delete(idx); else checkedSet.add(idx);
      render();
    }
  }, breaker(checkedSet.has(idx))));
  row.appendChild(h("p", { class: "checklist-text", style: "flex:1;" }, text));
  return row;
}

function smartSuggestionsPanel(site) {
  const sug = state.detail.suggestions;
  const hasText = (site.requirements || "").trim() || (site.firstImpressions || "").trim();
  const card = h("div", { class: "review-card" });
  card.appendChild(h("div", { class: "section-title", style: "margin-bottom:8px;" },
    icon("zap", { size: 15 }), h("h3", {}, "הצעות חכמות")));

  if (!hasText) {
    card.appendChild(h("p", { class: "muted", style: "font-size:12px;line-height:1.6;margin:0;" },
      "כדי לקבל הצעות, קודם הוסף דרישות לקוח או רשמים ראשוניים בלשונית סקירה."));
    return card;
  }

  if (!sug.stages.length && !sug.tasks.length && !sug.loading) {
    card.appendChild(h("p", { class: "muted", style: "font-size:12px;line-height:1.6;margin:0 0 10px;" },
      "ניתוח מקומי (בלי אינטרנט) של דרישות הלקוח והרשמים מהאתר, עם הצעות לשלבי עבודה ומשימות שאפשר להוסיף לרשימות בלחיצה."));
    card.appendChild(h("button", { class: "btn-primary", style: "width:100%;", onclick: () => runAnalysis(site) },
      icon("zap", { size: 15 }), " נתח והצע שלבים ומשימות"));
  }

  if (sug.loading) {
    card.appendChild(h("div", { style: "display:flex;align-items:center;gap:8px;justify-content:center;padding:8px 0;" },
      h("div", { class: "spinner", style: "width:16px;height:16px;border-width:2px;" }),
      h("span", { class: "muted", style: "font-size:13px;" }, "מנתח את הדרישות...")));
  }

  if (sug.stages.length) {
    card.appendChild(h("p", { class: "field-label", style: "margin-top:12px;" }, "שלבי עבודה מוצעים"));
    sug.stages.forEach((s, i) => card.appendChild(suggestionRow(s, sug.stagesChecked, i)));
  }
  if (sug.tasks.length) {
    card.appendChild(h("p", { class: "field-label", style: "margin-top:14px;" }, "משימות מוצעות"));
    sug.tasks.forEach((t, i) => card.appendChild(suggestionRow(t, sug.tasksChecked, i)));
  }
  if (sug.stages.length || sug.tasks.length) {
    card.appendChild(h("button", { class: "btn-primary", style: "width:100%;margin-top:12px;", onclick: applySuggestions }, "הוסף את הנבחרים לרשימות"));
    card.appendChild(h("button", { class: "btn-secondary", style: "width:100%;margin-top:8px;", onclick: () => { state.detail.suggestions = freshSuggestions(); render(); } }, "נקה הצעות"));
  }

  return card;
}

async function deleteSite(id) {
  await deleteSiteStorage(id);
  await deleteSiteFromCloud(id);
  delete state.siteCache[id];
  const newIndex = state.sites.filter((s) => s.id !== id);
  state.sites = newIndex;
  await saveIndexStorage(newIndex);
  state.view = "home";
  state.activeSite = null;
  render();
}

/* ---------------- backup / restore ---------------- */
async function buildExportPayload() {
  const records = {};
  for (const s of state.sites) {
    if (state.siteCache[s.id]) { records[s.id] = state.siteCache[s.id]; continue; }
    const { data } = await loadSiteStorage(s.id);
    if (data) records[s.id] = data;
  }
  return JSON.stringify({ exportedAt: new Date().toISOString(), index: state.sites, records }, null, 2);
}

function backupModal() {
  const overlay = h("div", { class: "overlay", onclick: () => { state.backup.open = false; render(); } });
  const sheet = h("div", { class: "sheet" });
  sheet.appendChild(h("div", { class: "sheet-head" }, h("h2", {}, "גיבוי ושחזור נתונים"),
    h("button", { class: "icon-btn", onclick: () => { state.backup.open = false; render(); } }, icon("x", { size: 20 }))));

  sheet.appendChild(h("p", { class: "muted", style: "font-size:12px;line-height:1.6;margin:0 0 12px;" },
    "מומלץ לגבות את הנתונים שלך מדי פעם לקובץ, כדי שיהיה גיבוי גם אם משהו קורה לדפדפן. לחיצה על \"הורד קובץ גיבוי\" תשמור קובץ שאפשר להעלות בחזרה בכל עת."));

  const downloadBtn = h("button", { class: "btn-primary", style: "width:100%;margin-bottom:16px;" }, icon("save", { size: 16 }), " הורד קובץ גיבוי");
  downloadBtn.addEventListener("click", async () => {
    downloadBtn.disabled = true;
    const prevText = downloadBtn.textContent;
    downloadBtn.textContent = "מכין קובץ...";
    try {
      const payload = await buildExportPayload();
      const blob = new Blob([payload], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const dateStr = new Date().toISOString().slice(0, 10);
      const a = document.createElement("a");
      a.href = url;
      a.download = `גיבוי-לוח-אתרים-${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) {
      alert("הפקת הגיבוי נכשלה: " + ((e && e.message) || e));
    }
    downloadBtn.disabled = false;
    downloadBtn.innerHTML = "";
    downloadBtn.appendChild(icon("save", { size: 16 }));
    downloadBtn.appendChild(document.createTextNode(" הורד קובץ גיבוי"));
  });
  sheet.appendChild(downloadBtn);

  sheet.appendChild(h("div", { style: "border-top:1px solid var(--border);margin:6px 0 14px;" }));

  sheet.appendChild(h("p", { class: "muted", style: "font-size:12px;line-height:1.6;margin:0 0 10px;" },
    "לשחזור: בחר קובץ גיבוי ששמרת בעבר, או הדבק את התוכן שלו כטקסט. שים לב — שחזור מחליף את כל האתרים המוצגים כרגע באפליקציה."));

  const restoreFromPayload = (raw) => {
    let parsed;
    try { parsed = JSON.parse(raw); }
    catch { alert("הקובץ/הטקסט שנבחר אינו גיבוי תקין."); return; }
    if (!parsed || !Array.isArray(parsed.index) || typeof parsed.records !== "object") {
      alert("הקובץ/הטקסט שנבחר אינו גיבוי תקין.");
      return;
    }
    state.sites = parsed.index;
    state.siteCache = { ...parsed.records };
    state.backup.open = false;
    saveIndexStorage(state.sites);
    Object.values(state.siteCache).forEach((s) => saveSiteStorage(s));
    render();
  };

  const fileLabel = h("label", { class: "btn-secondary", style: "width:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:10px;" }, "בחר קובץ גיבוי מהמכשיר");
  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = "application/json,.json";
  fileInput.style.display = "none";
  fileInput.addEventListener("change", () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => restoreFromPayload(String(reader.result || ""));
    reader.onerror = () => alert("קריאת הקובץ נכשלה.");
    reader.readAsText(file);
  });
  fileLabel.appendChild(fileInput);
  sheet.appendChild(fileLabel);

  sheet.appendChild(h("p", { class: "muted", style: "font-size:11px;text-align:center;margin:2px 0 10px;" }, "או"));

  const importArea = document.createElement("textarea");
  importArea.className = "input textarea mono";
  importArea.rows = 5;
  importArea.style.fontSize = "11px";
  importArea.placeholder = "הדבק כאן טקסט גיבוי...";
  sheet.appendChild(importArea);

  const importBtn = h("button", { class: "btn-primary", style: "width:100%;margin-top:10px;" }, "שחזר מהטקסט שהודבק");
  importBtn.addEventListener("click", () => restoreFromPayload(importArea.value));
  sheet.appendChild(importBtn);

  const container = document.createDocumentFragment();
  container.appendChild(overlay);
  container.appendChild(sheet);
  return container;
}

/* ---------------- boot ---------------- */
(async function init() {
  if (!storageSelfTest()) {
    state.errorMsg = "אזהרה: האחסון בדפדפן לא זמין כרגע — הנתונים לא יישמרו בין ביקורים. אפשר עדיין לעבוד ולהשתמש בגיבוי הידני.";
  }
  const list = await loadIndex();
  state.sites = list;
  list.forEach((s) => { state.siteCache[s.id] = s; });
  render();

  if (await tryInitFirebase()) {
    fbAuth.onAuthStateChanged(async (user) => {
      currentUser = user;
      if (user) {
        await onLogin(user);
      } else {
        state.cloudMode = false;
        state.loading = false;
        render();
      }
    });
  } else {
    state.loading = false;
    render();
  }
})();
</script>
