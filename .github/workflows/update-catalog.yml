name: Update ERCO Catalog

on:
  schedule:
    # Every Sunday at 03:00 UTC (~05:00/06:00 Israel time depending on DST)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      test_url:
        description: 'Test a single new site URL against existing handlers (leave empty for a normal full run)'
        required: false
        default: ''
      discover_url:
        description: 'Find candidate category URLs for a new supplier (give just their homepage)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Validate suppliers-config.json
        run: |
          python -c "
          import json, sys
          try:
              with open('suppliers-config.json', encoding='utf-8') as f:
                  data = json.load(f)
              names = [s['name'] for s in data['suppliers']]
              print(f'Config OK - {len(names)} suppliers: {names}')
          except Exception as e:
              print(f'::error::suppliers-config.json is broken: {e}')
              print('Check for a missing comma, quote, or bracket from a recent manual edit.')
              sys.exit(1)
          "

      - name: Run scraper
        env:
          TEST_URL: ${{ github.event.inputs.test_url }}
          DISCOVER_URL: ${{ github.event.inputs.discover_url }}
        run: python scripts/update_catalog.py

      - name: Commit updated catalog (only on a normal full run, and only if it changed)
        if: ${{ github.event.inputs.test_url == '' && github.event.inputs.discover_url == '' }}
        run: |
          git config user.name "catalog-bot"
          git config user.email "actions@github.com"
          git add catalog-data.json
          git diff --staged --quiet || git commit -m "Auto-update supplier catalogs"
          git push
