name: Update ERCO Catalog

on:
  schedule:
    # Every Sunday at 03:00 UTC (~05:00/06:00 Israel time depending on DST)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      test_url:
        description: 'Test a single new site URL (leave empty for a normal full run)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          TEST_URL: ${{ github.event.inputs.test_url }}
        run: python scripts/update_catalog.py

      - name: Commit updated catalog (only on a real run, and only if it changed)
        if: ${{ github.event.inputs.test_url == '' }}
        run: |
          git config user.name "catalog-bot"
          git config user.email "actions@github.com"
          git add catalog-data.json
          git diff --staged --quiet || git commit -m "Auto-update supplier catalogs"
          git push
