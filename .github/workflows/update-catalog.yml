name: Update ERCO Catalog

on:
  schedule:
    # Every Sunday at 03:00 UTC (~05:00/06:00 Israel time depending on DST)
    - cron: '0 3 * * 0'
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scripts/update_catalog.py

      - name: Commit updated catalog (only if it changed)
        run: |
          git config user.name "catalog-bot"
          git config user.email "actions@github.com"
          git add catalog-data.json
          git diff --staged --quiet || git commit -m "Auto-update supplier catalogs"
          git push
